<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>कलश स्थापना पुण्यार्जक | जिनधर्म आराधना चातुर्मास २०२६</title>

  <link rel="stylesheet" href="./css/style.css">
      <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/responsive.css">
  <link rel="stylesheet" href="./css/chaturmas.css">
</head>

<body>

  <div id="navbar"></div>
  <header class="site-header">
    <div class="container nav-wrapper">
      <a class="brand" href="index.html" aria-label="जिनधर्म आराधना">
        <span class="brand-icon">🪔</span>
        <span>
          <span class="brand-title">जिनधर्म आराधना</span>
          <span class="brand-subtitle">चातुर्मास २०२६</span>
        </span>
      </a>

      <nav class="main-nav" aria-label="मुख्य नेविगेशन">
        <a class="nav-link active" href="index.html">मुख्य पृष्ठ</a>
        <a class="nav-link" href="dainik-karyakram.html">दैनिक कार्यक्रम</a>
        <a class="nav-link" href="kalash.html">कलश स्थापना</a>
        <a class="nav-link" href="chowka.html">चौका नियम</a>
        <a class="nav-link" href="gallery.html">गैलरी</a>
        <a class="nav-link" href="team.html">टीम</a>
      </nav>
    </div>
  </header>

  <main>

    <section class="page-section kalash-directory-section">
      <div class="container">

        <div class="section-heading centered">
          <h1 class="section-title">कलश स्थापना पुण्यार्जक</h1>
        </div>

        <!-- Filters -->
        <div class="kalash-filter-panel">

          <div class="kalash-filter-field">
            <label for="kalash-name-filter">
              नाम से खोजें
            </label>

            <input type="search" id="kalash-name-filter" class="kalash-filter-input"
              placeholder="पुण्यार्जक का नाम लिखें..." autocomplete="off">
          </div>

          <div class="kalash-filter-field">
            <label for="kalash-type-filter">
              कलश प्रकार
            </label>

            <select id="kalash-type-filter" class="kalash-filter-select">
              <option value="">सभी कलश प्रकार</option>
            </select>
          </div>

          <div class="kalash-filter-field">
            <label for="kalash-number-filter">
              कलश नंबर
            </label>

            <select id="kalash-number-filter" class="kalash-filter-select">
              <option value="">सभी कलश नंबर</option>
            </select>
          </div>

          <button type="button" id="kalash-clear-filters" class="kalash-clear-button">
            फ़िल्टर साफ़ करें
          </button>

        </div>

        <!-- Result Summary -->
        <div class="kalash-result-summary">
          <span id="kalash-result-count">
            पुण्यार्जक सूची लोड हो रही है...
          </span>
        </div>

        <!-- Cards -->
        <div id="kalash-grid" class="kalash-grid" aria-live="polite"></div>

        <!-- Loading -->
        <div id="kalash-loader" class="kalash-loader" aria-hidden="true">
          सूची लोड हो रही है...
        </div>

        <!-- Empty State -->
        <div id="kalash-empty" class="kalash-empty" hidden>
          <div class="kalash-empty-icon">🔎</div>
          <h3>कोई पुण्यार्जक नहीं मिला</h3>
          <p>
            कृपया नाम या कलश प्रकार बदलकर पुनः प्रयास करें।
          </p>
        </div>

      </div>
    </section>

  </main>

  <div id="footer"></div>
  <div id="navbar"></div>
  <script src="./js/components.js"></script>
  <script src="js/daily-data.js"></script>
  <script src="./js/kalash.js"></script>

</body>

</html>
